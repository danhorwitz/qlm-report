<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Breeze QLM License Report</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; max-width: 1100px; margin-inline: auto;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff; color: #1a1a1a;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  button.refresh { padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 12px; }
  button.refresh:hover { background: #f5f5f5; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: #f7f7f8; border: 1px solid #e5e5e7; border-radius: 10px; padding: 14px 16px; }
  .card .num { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .card .label { font-size: 12px; color: #666; margin-top: 4px; }
  .card.warn .num { color: #b45309; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #e5e5e7; }
  .tab { padding: 8px 14px; font-size: 13px; cursor: pointer; border: none; background: none; color: #666; border-bottom: 2px solid transparent; }
  .tab.active { color: #1a1a1a; border-bottom-color: #4f46e5; font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .chart-box { background: #f7f7f8; border: 1px solid #e5e5e7; border-radius: 10px; padding: 12px; height: 260px; }
  .chart-box h3 { font-size: 13px; margin: 0 0 8px; color: #444; }
  .note { font-size: 12px; color: #888; background: #fafafa; border: 1px dashed #ddd; border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
  input.search-box { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
  #errorBox { display:none; color:#991b1b; background:#fee2e2; border-radius:8px; padding:12px 16px; font-size:13px; }
</style>
<link href="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/theme/mermaid.min.css" rel="stylesheet" />
</head>
<body>

<h1>Breeze QLM License Report</h1>
<div class="subtitle">
  <span id="subtitle">Loading data from QLM…</span>
  <button class="refresh" onclick="loadData(true)">Refresh</button>
</div>

<div id="errorBox"></div>

<div id="content" style="display:none;">
  <div class="cards" id="cards"></div>

  <div class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="licenses">Licenses</button>
    <button class="tab" data-tab="customers">Customers</button>
  </div>

  <div class="panel active" id="panel-overview">
    <div class="charts-row">
      <div class="chart-box"><h3>Licenses by product</h3><canvas id="chartProduct"></canvas></div>
      <div class="chart-box"><h3>Licenses by model</h3><canvas id="chartModel"></canvas></div>
    </div>
  </div>

  <div class="panel" id="panel-licenses">
    <input class="search-box" id="licenseSearch" placeholder="Filter by name, computer ID, email, company, organization, or product…">
    <div id="licenseGrid"></div>
  </div>

  <div class="panel" id="panel-customers">
    <div id="customerGrid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js"></script>
<script>
let productChart, modelChart;

function isFarFutureOrEmpty(dateStr) {
  if (!dateStr) return true;
  const y = parseInt(dateStr.slice(0, 4), 10);
  return isNaN(y) || y >= 2090;
}
function daysUntil(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  return Math.floor((d.getTime() - Date.now()) / 86400000);
}

async function loadData(forceRefresh) {
  const errorBox = document.getElementById("errorBox");
  errorBox.style.display = "none";
  try {
    const res = await fetch(forceRefresh ? "/api/refresh" : "/api/licenses");
    const payload = await res.json();
    if (!res.ok) throw new Error(payload.error || "Failed to load");
    render(payload.licenses, payload.generatedAt);
  } catch (err) {
    errorBox.style.display = "block";
    errorBox.textContent = "Couldn't load QLM data: " + err.message;
    document.getElementById("subtitle").textContent = "Failed to load data.";
  }
}

function render(rawLicenses, generatedAt) {
  const licenses = rawLicenses.map(l => ({
    licenseId: l.LicenseID, activationKey: l.ActivationKey,
    product: l.ProductName || "(unspecified)",
    orderDate: l.OrderDate, orderStatus: l.OrderStatus,
    expiry: l.SubscriptionExpiryDate,
    model: (l.LicenseModel || "unknown").toLowerCase(),
    disabled: l.Disabled === "true",
    numLicenses: parseInt(l.NumLicenses || "0", 10),
    fullName: l.FullName, email: l.Email,
    company: l.Company || l.CustomerOrganizationName || "(no company)",
    computerId: l.ComputerID,
    organizationName: l.OrganizationName || l.CustomerOrganizationName,
    majorVersion: l.MajorVersion,
    comment: l.Comment,
    features: l.Features,
    activationDate: l.ActivationDate,
    creationDate: l.CreationDate,
    customerId: l.CustomerID,
    organization: l.CustomerOrganizationName,
    phone: l.Phone,
    mobile: l.Mobile,
    country: l.Country,
    state: l.State,
    city: l.City,
    zip: l.Zip,
    address1: l.Address1,
    address2: l.Address2,
    notes: l.Notes,
  }));

  document.getElementById("subtitle").textContent =
    `${licenses.length} license record(s) — last updated ${new Date(generatedAt).toLocaleString()}`;
  document.getElementById("content").style.display = "block";

  const totalSeats = licenses.reduce((s, l) => s + (l.numLicenses || 0), 0);
  const activeCount = licenses.filter(l => !l.disabled).length;
  const companies = new Set(licenses.map(l => l.company));
  const expiringSoon = licenses.filter(l => {
    if (isFarFutureOrEmpty(l.expiry) || l.disabled) return false;
    const d = daysUntil(l.expiry);
    return d !== null && d >= 0 && d <= 30;
  }).length;

  const cards = [
    { num: licenses.length, label: "Total licenses" },
    { num: activeCount, label: "Active licenses" },
    { num: totalSeats, label: "Total seats" },
    { num: companies.size, label: "Unique companies" },
    { num: expiringSoon, label: "Expiring in 30 days", warn: expiringSoon > 0 },
  ];
  document.getElementById("cards").innerHTML = cards.map(c =>
    `<div class="card ${c.warn ? "warn" : ""}"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`
  ).join("");

  const byProduct = {}, byModel = {};
  licenses.forEach(l => {
    byProduct[l.product] = (byProduct[l.product] || 0) + 1;
    byModel[l.model] = (byModel[l.model] || 0) + 1;
  });

  if (productChart) productChart.destroy();
  if (modelChart) modelChart.destroy();

  productChart = new Chart(document.getElementById("chartProduct"), {
    type: "bar",
    data: { labels: Object.keys(byProduct), datasets: [{ data: Object.values(byProduct), backgroundColor: "#4f46e5" }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
  });
  modelChart = new Chart(document.getElementById("chartModel"), {
    type: "doughnut",
    data: { labels: Object.keys(byModel), datasets: [{ data: Object.values(byModel), backgroundColor: ["#4f46e5", "#22c55e", "#f59e0b", "#ef4444", "#06b6d4"] }] },
    options: { responsive: true, maintainAspectRatio: false },
  });

  const licenseRows = licenses.map(l => [
    l.fullName || "—",
    l.computerId || "—",
    l.email || "—",
    l.company || "—",
    l.organizationName || "—",
    l.product || "—",
    l.majorVersion || "—",
    isFarFutureOrEmpty(l.expiry) ? "No expiry" : l.expiry.slice(0, 10),
    l.activationKey || "—",
    l.comment || "—",
    l.features || "—",
    l.activationDate ? l.activationDate.slice(0, 10) : "—",
    l.creationDate ? l.creationDate.slice(0, 10) : "—",
  ]);

  document.getElementById("licenseGrid").innerHTML = "";
  const licenseGrid = new gridjs.Grid({
    columns: [
      "Full Name", "Computer ID", "Email", "Company", "Organization Name",
      "Product Name", "Major Version", "Subscription Expiry Date",
      "Activation Key", "Comment", "Enabled Features", "Activation Date", "Creation Date",
    ],
    data: licenseRows, sort: true, pagination: { limit: 15 }, search: false,
  }).render(document.getElementById("licenseGrid"));

  document.getElementById("licenseSearch").oninput = (e) => {
    licenseGrid.updateConfig({ search: { keyword: e.target.value } }).forceRender();
  };

  const byCustomer = new Map();
  licenses.forEach(l => {
    const key = l.customerId || `${l.email}|${l.fullName}`;
    if (!byCustomer.has(key)) byCustomer.set(key, l);
  });
  const customerRows = Array.from(byCustomer.values())
    .sort((a, b) => (a.fullName || "").localeCompare(b.fullName || ""))
    .map((c, i) => [
      i + 1,
      c.fullName || "—",
      c.email || "—",
      c.organization || "—",
      c.company || "—",
      c.phone || "—",
      c.mobile || "—",
      c.country || "—",
      c.state || "—",
      c.city || "—",
      c.zip || "—",
      c.address1 || "—",
      c.address2 || "—",
      c.notes || "—",
    ]);

  document.getElementById("customerGrid").innerHTML = "";
  new gridjs.Grid({
    columns: [
      "#", "Full Name", "Email", "Organization", "Company", "Phone", "Mobile",
      "Country", "State / Region", "City", "Zip / Postal Code", "Address 1", "Address 2", "Notes",
    ],
    data: customerRows, sort: true, search: true, pagination: { limit: 15 },
  }).render(document.getElementById("customerGrid"));

  document.querySelectorAll(".tab").forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
    };
  });
}

loadData(false);
</script>
</body>
</html>
